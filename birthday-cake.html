<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Make a Wish! 🎂</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(ellipse at top, #1a1c29 0%, #0c0d14 60%, #050608 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      position: relative;
    }

    /* Subtle Gold Stars Background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 15% 20%, rgba(212,175,55,0.45) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 78% 15%, rgba(255,215,0,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 35% 75%, rgba(212,175,55,0.35) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 88% 68%, rgba(255,215,0,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 20% 85%, rgba(212,175,55,0.35) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* Ambient Warm Glow behind the Cake */
    .glow-aura {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.12) 0%, rgba(255, 215, 0, 0.05) 45%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      filter: blur(20px);
    }

    /* Confetti Canvas */
    #confetti {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 10;
      padding: 20px;
    }

    /* Back Button */
    .back-button {
      position: fixed;
      top: 30px;
      left: 30px;
      background: rgba(212, 175, 55, 0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.35);
      color: #d4af37;
      padding: 10px 22px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
      z-index: 1000;
      text-decoration: none;
    }

    .back-button:hover {
      background: rgba(212, 175, 55, 0.22);
      border-color: #ffd700;
      transform: translateX(-5px);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
    }

    .back-icon {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
    }

    /* SVG Cake Wrapper */
    .cake-wrapper {
      position: relative;
      width: 360px;
      height: 350px;
      margin-bottom: 24px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    #cake-svg {
      display: block;
      width: 100%;
      height: 100%;
      transform: scale(0);
      filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.7));
      animation: popCake 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.3s forwards;
    }

    @keyframes popCake {
      to {
        transform: scale(1);
      }
    }

    /* HTML overlay for Candle and Flame */
    .candle-container {
      position: absolute;
      top: 42px;
      left: 50%;
      transform: translateX(-50%) translateY(-200px);
      width: 10px;
      height: 42px;
      background: linear-gradient(180deg, #fff9db 0%, #ffd700 70%, #d4af37 100%);
      border-radius: 4px;
      z-index: 50;
      opacity: 0;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    /* Candle details */
    .candle-container::after, .candle-container::before {
      content: "";
      position: absolute;
      width: 100%;
      height: 3px;
      background: rgba(170, 119, 28, 0.5);
    }
    .candle-container::after { top: 25%; }
    .candle-container::before { top: 58%; }

    /* Animated entry of candle */
    .candle-container.appear {
      animation: candleIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes candleIn {
      to {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }
    }

    /* Candle Hover interaction */
    .candle-container.appear:hover {
      transform: translateX(-50%) translateY(-3px) scale(1.08);
    }

    /* Flicker flame */
    .fuego {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 11px;
      height: 20px;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      background: radial-gradient(ellipse at 50% 80%, #ffffff 0%, #fff2cc 30%, #ffd700 60%, #ff8f00 95%);
      box-shadow: 0 0 15px #ffd700, 0 0 30px #ff9100, 0 0 45px rgba(255,143,0,0.6);
      transform-origin: bottom center;
      animation: flicker 0.15s ease-in-out infinite alternate;
      display: none;
    }

    .candle-container.appear .fuego {
      display: block;
      animation-delay: 0.6s;
    }

    .candle-container.blown-out .fuego {
      display: none !important;
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) rotate(-3deg) scaleX(0.92); }
      100% { transform: translateX(-50%) rotate(3deg) scaleX(1.08) scaleY(1.05); }
    }

    /* Floating Glassmorphic Instruction Card */
    .text-instruction {
      background: rgba(18, 20, 32, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 20px;
      padding: 22px 28px;
      text-align: center;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 25px rgba(212, 175, 55, 0.12);
      animation: floatCard 4s ease-in-out infinite alternate;
      z-index: 10;
    }

    @keyframes floatCard {
      0% { transform: translateY(0); }
      100% { transform: translateY(-6px); }
    }

    .text-instruction h1 {
      font-size: 1.4rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff2cc 0%, #d4af37 50%, #aa771c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .text-instruction p {
      font-size: 0.9rem;
      color: rgba(220, 205, 170, 0.85);
      font-weight: 500;
      line-height: 1.5;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.5s ease;
    }

    .text-instruction.active p {
      opacity: 1;
      transform: translateY(0);
    }

    /* Action button at bottom */
    .btn-bottom {
      margin-top: 22px;
      padding: 13px 32px;
      font-size: 0.92rem;
      border-radius: 50px;
      background: linear-gradient(135deg, #ffd700 0%, #d4af37 50%, #aa771c 100%);
      color: #0c0d14;
      border: none;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.45);
      cursor: pointer;
      font-weight: 700;
      font-family: 'Poppins', sans-serif;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
    }

    .btn-bottom.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .btn-bottom:hover {
      transform: scale(1.06) translateY(-2px);
      box-shadow: 0 6px 25px rgba(255, 215, 0, 0.65);
      color: #000;
    }

    @media (max-width: 480px) {
      .back-button {
        top: 20px;
        left: 20px;
        padding: 8px 18px;
        font-size: 13px;
      }
      .cake-wrapper {
        width: 310px;
        height: 310px;
      }
      .text-instruction {
        padding: 18px 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Confetti Canvas -->
  <canvas id="confetti"></canvas>

  <!-- Tombol Back -->
  <a class="back-button" href="name.html">
    <svg class="back-icon" viewBox="0 0 24 24">
      <path d="M19 12H5M12 19l-7-7 7-7" />
    </svg>
    <span>Back</span>
  </a>

  <div class="container">
    
    <!-- Warm Aura Glow -->
    <div class="glow-aura"></div>

    <div class="cake-wrapper">
      <!-- SVG Cake Tiered with Midnight Luxury Styling -->
      <svg id="cake-svg" viewBox="0 0 300 300" xml:space="preserve">
        <defs>
          <!-- Gold Stand Gradient -->
          <linearGradient id="gold-stand" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#8a5e12" />
            <stop offset="25%" stop-color="#ffd700" />
            <stop offset="50%" stop-color="#fff5cc" />
            <stop offset="75%" stop-color="#d4af37" />
            <stop offset="100%" stop-color="#7a520e" />
          </linearGradient>

          <!-- Cake Tiers: Deep Midnight Velvet -->
          <linearGradient id="tier-dark-1" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#141626" />
            <stop offset="35%" stop-color="#2a2e47" />
            <stop offset="70%" stop-color="#1f2238" />
            <stop offset="100%" stop-color="#0f111e" />
          </linearGradient>

          <linearGradient id="tier-top-1" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#3b4163" />
            <stop offset="100%" stop-color="#24283f" />
          </linearGradient>

          <!-- Molten Gold Glaze -->
          <linearGradient id="gold-drip" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fff8db" />
            <stop offset="30%" stop-color="#ffd700" />
            <stop offset="70%" stop-color="#d4af37" />
            <stop offset="100%" stop-color="#996a14" />
          </linearGradient>

          <!-- Gold Pearl / Sprinkle -->
          <radialGradient id="gold-pearl" cx="35%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="45%" stop-color="#ffd700" />
            <stop offset="100%" stop-color="#996a14" />
          </radialGradient>
        </defs>

        <!-- Cake Stand Pedestal -->
        <ellipse cx="150" cy="278" rx="60" ry="8" fill="url(#gold-stand)" opacity="0.9" />
        <rect x="142" y="260" width="16" height="19" fill="url(#gold-stand)" />
        <ellipse cx="150" cy="260" rx="122" ry="14" fill="url(#gold-stand)" />
        <ellipse cx="150" cy="258" rx="116" ry="11" fill="#1b1c2b" opacity="0.7" />

        <!-- Bottom Tier (Layer 1) -->
        <path d="M 50 195 A 100 16 0 0 0 250 195 L 250 250 A 100 16 0 0 1 50 250 Z" fill="url(#tier-dark-1)" />
        <ellipse cx="150" cy="195" rx="100" ry="16" fill="url(#tier-top-1)" />
        
        <!-- Molten Gold Drips on Bottom Tier -->
        <path d="M 50 195 Q 70 216 90 195 Q 110 218 130 195 Q 150 220 170 195 Q 190 216 210 195 Q 230 218 250 195 L 250 206 Q 230 228 210 206 Q 190 228 170 206 Q 150 230 130 206 Q 110 228 90 206 Q 70 228 50 206 Z" fill="url(#gold-drip)" />

        <!-- Middle Tier (Layer 2) -->
        <path d="M 75 135 A 75 13 0 0 0 225 135 L 225 195 A 75 13 0 0 1 75 195 Z" fill="url(#tier-dark-1)" />
        <ellipse cx="150" cy="135" rx="75" ry="13" fill="url(#tier-top-1)" />
        
        <!-- Molten Gold Drips on Middle Tier -->
        <path d="M 75 135 Q 95 152 115 135 Q 135 154 155 135 Q 175 152 195 135 Q 215 152 225 135 L 225 144 Q 215 162 195 144 Q 175 162 155 144 Q 135 164 115 144 Q 95 162 75 144 Z" fill="url(#gold-drip)" />

        <!-- Top Tier (Layer 3) -->
        <path d="M 100 80 A 50 9 0 0 0 200 80 L 200 135 A 50 9 0 0 1 100 135 Z" fill="url(#tier-dark-1)" />
        <ellipse cx="150" cy="80" rx="50" ry="9" fill="url(#tier-top-1)" />
        
        <!-- Molten Gold Drips on Top Tier -->
        <path d="M 100 80 Q 115 94 130 80 Q 145 96 160 80 Q 175 94 190 80 Q 200 80 200 80 L 200 89 Q 190 102 175 89 Q 160 105 145 89 Q 130 102 115 89 Q 100 102 100 89 Z" fill="url(#gold-drip)" />

        <!-- Gold Pearls & Sprinkles (Bottom Tier) -->
        <circle cx="85" cy="235" r="3.5" fill="url(#gold-pearl)" />
        <circle cx="115" cy="242" r="3" fill="#ffffff" opacity="0.8" />
        <circle cx="150" cy="246" r="3.5" fill="url(#gold-pearl)" />
        <circle cx="185" cy="243" r="3" fill="#ffffff" opacity="0.8" />
        <circle cx="215" cy="236" r="3.5" fill="url(#gold-pearl)" />
        
        <!-- Gold Pearls & Sprinkles (Middle Tier) -->
        <circle cx="105" cy="175" r="3" fill="url(#gold-pearl)" />
        <circle cx="130" cy="182" r="2.5" fill="#ffffff" opacity="0.9" />
        <circle cx="150" cy="180" r="3" fill="url(#gold-pearl)" />
        <circle cx="170" cy="182" r="2.5" fill="#ffffff" opacity="0.9" />
        <circle cx="195" cy="176" r="3" fill="url(#gold-pearl)" />

        <!-- Gold Pearls (Top Tier) -->
        <circle cx="125" cy="118" r="2.5" fill="url(#gold-pearl)" />
        <circle cx="150" cy="122" r="3" fill="url(#gold-pearl)" />
        <circle cx="175" cy="118" r="2.5" fill="url(#gold-pearl)" />

        <!-- Subtle "20" badge on center of middle tier -->
        <text x="150" y="166" font-family="'Poppins', sans-serif" font-weight="700" font-size="13" fill="#ffd700" text-anchor="middle" letter-spacing="2">20</text>
      </svg>
      
      <!-- Candle and Flame container -->
      <div class="candle-container" id="candle">
        <div class="fuego"></div>
      </div>
      
    </div>

    <div class="text-instruction" id="instructions">
      <h1>Happy Birthday Sintia!</h1>
      <p id="instruction-p">Kue ulang tahunmu sedang dibuat... Mohon tunggu sebentar ya.</p>
    </div>

    <button class="btn-bottom" id="btnNext" onclick="window.location.href='utama.html'">
      Lanjut ke Halaman Utama ➔
    </button>
  </div>

  <script>
    // Synthesizer Web Audio API
    class SoundSynth {
      constructor() {
        this.audioCtx = null;
      }
      init() {
        if (!this.audioCtx) {
          this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }
      playTone(freq, duration, type = 'sine') {
        this.init();
        if (this.audioCtx.state === 'suspended') {
          this.audioCtx.resume();
        }
        const osc = this.audioCtx.createOscillator();
        const gain = this.audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, this.audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.audioCtx.destination);
        osc.start();
        osc.stop(this.audioCtx.currentTime + duration);
      }
      playBlowSuccess() {
        // Play retro fan-fare success sound
        const t = 0.12;
        this.playTone(523.25, t, 'square'); // C5
        setTimeout(() => this.playTone(659.25, t, 'square'), t * 1000); // E5
        setTimeout(() => this.playTone(783.99, t, 'square'), t * 2000); // G5
        setTimeout(() => this.playTone(1046.50, t * 2, 'square'), t * 3000); // C6
      }
    }

    const synth = new SoundSynth();

    // Sound Clapping Hands with fallback
    const applause = new Audio("https://assets.mixkit.co/active_storage/sfx/2019/clapping-hands-sound-effect-2019-preview.mp3");
    applause.volume = 0.6;

    function playSuccessClapping() {
      // Play retro tone fanfare
      synth.playBlowSuccess();
      
      // Play clapping hands mp3
      applause.play().catch(e => {
        console.log("Primary clapping sound blocked or failed, trying backup:", e);
        const backupApplause = new Audio("https://www.soundjay.com/human/sounds/applause-01.mp3");
        backupApplause.volume = 0.6;
        backupApplause.play().catch(err => console.log("All audio links blocked", err));
      });
    }

    // Trigger candle and instructions appear after cake builds (around 6s)
    const candle = document.getElementById('candle');
    const instructionText = document.getElementById('instructions');
    const instructionP = document.getElementById('instruction-p');
    const btnNext = document.getElementById('btnNext');

    setTimeout(() => {
      candle.classList.add('appear');
      instructionText.classList.add('active');
      instructionP.textContent = "Tiup lilinnya! (Ketuk lilin untuk meniup api 🕯️)";
    }, 2200);

    // Candle blow click interaction
    let isBlown = false;
    candle.addEventListener('click', () => {
      if (isBlown) return;
      isBlown = true;
      candle.classList.add('blown-out');
      playSuccessClapping();
      instructionP.textContent = "Hore! Harapanmu sudah terkirim! Tiupan lilinmu sangat keren! 🎉";
      
      // Start confetti burst
      startConfetti();
      
      // Show action button
      setTimeout(() => {
        btnNext.classList.add('show');
      }, 1000);
    });

    // Confetti Animation Logic
    function startConfetti() {
      const canvas = document.getElementById('confetti');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const pieces = [];
      const colors = ['#ffd700', '#d4af37', '#fff2cc', '#ffffff', '#e5c07b', '#f3e5ab', '#aa771c'];

      for (let i = 0; i < 180; i++) {
        pieces.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          speed: Math.random() * 3 + 2,
          rotation: Math.random() * 360,
          rotationSpeed: Math.random() * 8 - 4
        });
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        });
      }

      function update() {
        pieces.forEach(p => {
          p.y += p.speed;
          p.rotation += p.rotationSpeed;
          if (p.y > canvas.height) {
            p.y = -10;
            p.x = Math.random() * canvas.width;
          }
        });
      }

      function loop() {
        draw();
        update();
        requestAnimationFrame(loop);
      }

      loop();
    }
  </script>
</body>
</html>
