<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Sintia Geni Audi Nainggolan!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Georgia&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(ellipse at top, #1a1c29 0%, #0c0d14 60%, #050608 100%);
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
      position: relative;
      padding: 20px;
    }

    /* Floating particles background */
    .particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.35) 0%, rgba(212, 175, 55, 0.05) 70%, transparent 100%);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.25);
      animation: float 15s infinite ease-in-out;
    }

    .particle:nth-child(1) {
      width: 80px;
      height: 80px;
      top: 10%;
      left: 15%;
      animation-delay: 0s;
    }

    .particle:nth-child(2) {
      width: 60px;
      height: 60px;
      top: 70%;
      left: 80%;
      animation-delay: 3s;
    }

    .particle:nth-child(3) {
      width: 100px;
      height: 100px;
      top: 50%;
      left: 5%;
      animation-delay: 6s;
    }

    .particle:nth-child(4) {
      width: 70px;
      height: 70px;
      top: 20%;
      left: 85%;
      animation-delay: 9s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) translateX(0) scale(1);
        opacity: 0.4;
      }
      25% {
        transform: translateY(-30px) translateX(20px) scale(1.1);
        opacity: 0.7;
      }
      50% {
        transform: translateY(-60px) translateX(-20px) scale(0.9);
        opacity: 0.5;
      }
      75% {
        transform: translateY(-30px) translateX(30px) scale(1.05);
        opacity: 0.8;
      }
    }

    .container {
      text-align: center;
      perspective: 1000px;
      z-index: 10;
      padding: 20px;
      max-width: 600px;
      width: 100%;
    }

    .hello-text {
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      color: #c5a880;
      font-weight: 300;
      letter-spacing: 5px;
      margin-bottom: 5px;
      opacity: 0;
      animation: slowFadeIn 2s ease-out forwards;
      text-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
      font-family: 'Georgia', serif;
    }

    @keyframes slowFadeIn {
      0% {
        opacity: 0;
        transform: translateY(-20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .name-wrapper {
      display: inline-block;
      position: relative;
      margin-bottom: 15px;
    }

    .name-3d {
      font-size: clamp(2rem, 5.5vw, 3.4rem);
      line-height: 1.25;
      word-break: break-word;
      font-weight: 700;
      color: #fffdf5;
      text-transform: capitalize;
      letter-spacing: 1.5px;
      position: relative;
      display: inline-block;
      animation: rotate3d 8s infinite ease-in-out;
      transform-style: preserve-3d;
      text-shadow:
        0 0 10px #d4af37,
        2px 2px 0 #aa771c,
        4px 4px 0 #855b14,
        0 0 25px rgba(212, 175, 55, 0.6),
        0 0 50px rgba(212, 175, 55, 0.3);
      -webkit-text-stroke: 1px #d4af37;
      font-family: 'Georgia', serif;
    }

    @keyframes rotate3d {
      0%, 100% { transform: rotateX(0deg) rotateY(0deg); }
      25% { transform: rotateX(6deg) rotateY(-6deg); }
      50% { transform: rotateX(-6deg) rotateY(6deg); }
      75% { transform: rotateX(6deg) rotateY(6deg); }
    }

    .subtitle {
      font-size: clamp(0.9rem, 2.5vw, 1.25rem);
      color: #e5c07b;
      margin-top: 15px;
      font-weight: 300;
      letter-spacing: 4px;
      opacity: 0;
      animation: fadeInUp 1.5s ease-out 0.5s forwards;
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .decorative-line {
      width: clamp(140px, 40vw, 260px);
      height: 2px;
      background: linear-gradient(90deg, transparent, #d4af37, transparent);
      margin: 25px auto;
      opacity: 0;
      animation: fadeInUp 1.5s ease-out 1s forwards;
    }

    .accent-dots {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
      opacity: 0;
      animation: fadeInUp 1.5s ease-out 1.4s forwards;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffd700;
      box-shadow: 0 0 14px rgba(255, 215, 0, 0.9);
      animation: pulse 2s infinite ease-in-out;
    }

    .dot:nth-child(2) { animation-delay: 0.3s; }
    .dot:nth-child(3) { animation-delay: 0.6s; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }

    /* Photo Card Styles */
    .photo-section {
      margin-top: 40px;
      opacity: 0;
      animation: fadeInUp 1.5s ease-out 1.8s forwards;
    }

    .photo-card {
      background: rgba(18, 20, 32, 0.85);
      border-radius: 24px;
      padding: 25px;
      max-width: 340px;
      margin: 0 auto;
      border: 1px solid rgba(212, 175, 55, 0.3);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 25px rgba(212, 175, 55, 0.12);
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
    }

    .photo-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(212, 175, 55, 0.25);
      border-color: rgba(255, 215, 0, 0.6);
    }

    .photo-placeholder {
      width: 100%;
      height: 260px;
      background: linear-gradient(135deg, #232535 0%, #161824 100%);
      border: 1px dashed rgba(212, 175, 55, 0.4);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      transition: all 0.4s ease;
    }

    .photo-icon {
      font-size: 3rem;
      animation: bounce 2s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .photo-text {
      color: #fffdf5;
      font-size: 1.05rem;
      font-weight: 600;
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
    }

    .photo-hint {
      color: rgba(212, 175, 55, 0.8);
      font-size: 0.8rem;
      font-style: italic;
    }

    .photo-image {
      width: 100%;
      height: 260px;
      border-radius: 16px;
      object-fit: cover;
      display: none;
      animation: zoomIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1); }
    }

    .photo-card.revealed .photo-placeholder { display: none; }
    .photo-card.revealed .photo-image { display: block; }

    .photo-caption {
      margin-top: 15px;
      font-size: 1rem;
      color: #d4af37;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.4s ease 0.2s;
    }

    .photo-card.revealed .photo-caption { opacity: 1; }

    /* Button styles */
    .btn-action {
      margin-top: 30px;
      padding: 14px 34px;
      font-size: 0.95rem;
      border-radius: 50px;
      background: linear-gradient(135deg, #ffd700 0%, #d4af37 50%, #aa771c 100%);
      color: #0c0d14;
      border: none;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: inline-block;
      text-decoration: none;
    }

    .btn-action:hover {
      transform: scale(1.06) translateY(-2px);
      box-shadow: 0 6px 25px rgba(255, 215, 0, 0.6);
      color: #000;
    }

    .btn-action:active {
      transform: scale(0.98) translateY(0);
    }
  </style>
</head>
<body>

  <!-- Background Decorative Particles -->
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>

  <div class="container">
    <p class="hello-text">Special for</p>
    <div class="name-wrapper">
      <h1 class="name-3d">Sintia Geni Audi Nainggolan</h1>
    </div>
    
    <p class="subtitle">Wishing you a happy birthday</p>
    
    <div class="decorative-line"></div>
    
    <div class="accent-dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <div class="photo-section">
      <div class="photo-card" id="photoCard">
        <div class="photo-placeholder">
          <div class="photo-icon">📸</div>
          <div class="photo-text">Klik untuk melihat foto</div>
          <div class="photo-hint">Tap to reveal</div>
        </div>
        <img src="assets/photo1.png" alt="Foto Sintia" class="photo-image">
        <p class="photo-caption">Special Day</p>
      </div>
      
      <button class="btn-action" onclick="window.location.href='birthday-cake.html'">
        Lihat Kejutan ➔
      </button>
    </div>
  </div>

  <script>
    const photoCard = document.getElementById('photoCard');
    photoCard.addEventListener('click', function () {
      this.classList.add('revealed');
    });
  </script>
</body>
</html>
