<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sintia's Birthday Game Hub 🎮</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: all 0.3s ease;
    }

    body {
      font-family: "Poppins", sans-serif;
      background: radial-gradient(ellipse at top, #1a1c29 0%, #0c0d14 60%, #050608 100%);
      color: rgba(220, 205, 170, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Subtle Gold Stars Background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 20% 15%, rgba(212,175,55,0.4) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 75% 12%, rgba(255,215,0,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 40% 75%, rgba(212,175,55,0.3) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 85% 65%, rgba(255,215,0,0.35) 0%, transparent 100%),
        radial-gradient(1px 1px at 15% 85%, rgba(212,175,55,0.35) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* Back Button */
    .back-button {
      position: fixed;
      top: 30px;
      left: 30px;
      background: rgba(212, 175, 55, 0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.35);
      color: #d4af37;
      padding: 10px 22px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 1000;
      text-decoration: none;
    }

    .back-button:hover {
      background: rgba(212, 175, 55, 0.22);
      transform: translateX(-5px);
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.2);
    }

    .back-icon {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
    }

    header {
      text-align: center;
      padding: 80px 20px 20px;
      position: relative;
      z-index: 1;
    }

    header h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
      font-weight: 700;
      background: linear-gradient(135deg, #fff2cc 0%, #d4af37 60%, #aa771c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      font-size: 0.95rem;
      color: rgba(212, 175, 55, 0.7);
    }

    /* Game cards grid container */
    .game-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      padding: 40px 20px 80px;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }

    .game-card {
      background: linear-gradient(145deg, #181a2b 0%, #10121f 100%);
      border-radius: 20px;
      padding: 24px;
      width: 240px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(212, 175, 55, 0.08);
      border: 1px solid rgba(212, 175, 55, 0.25);
    }

    .game-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6), 0 0 30px rgba(212, 175, 55, 0.2);
      border-color: rgba(212, 175, 55, 0.5);
    }

    .game-art-placeholder {
      width: 120px;
      height: 120px;
      margin: 0 auto 15px;
      background: rgba(212, 175, 55, 0.08);
      border: 2px solid rgba(212, 175, 55, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      box-shadow: 0 6px 15px rgba(0,0,0,0.3);
    }

    .game-info h2 {
      font-size: 1.15rem;
      background: linear-gradient(135deg, #fff2cc 0%, #d4af37 60%, #aa771c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .game-info p {
      font-size: 0.8rem;
      color: rgba(212, 175, 55, 0.65);
      margin-bottom: 15px;
      line-height: 1.4;
      height: 40px;
    }

    .play-btn {
      display: inline-block;
      background: linear-gradient(135deg, #ffd700 0%, #d4af37 60%, #aa771c 100%);
      color: #0c0d14;
      font-weight: 700;
      border: none;
      padding: 9px 22px;
      border-radius: 20px;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.85rem;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35);
    }

    .play-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.55);
    }

    footer {
      width: 100%;
      text-align: center;
      padding: 20px;
      color: rgba(212, 175, 55, 0.65);
      font-size: 0.85rem;
      margin-top: auto;
      font-weight: 600;
      position: relative;
      z-index: 1;
    }

    @media (max-width: 480px) {
      header h1 { font-size: 1.8rem; }
      .game-container {
        flex-direction: column;
        gap: 25px;
      }
      .game-card { width: 100%; max-width: 260px; }
    }
  </style>
</head>
<body>

  <!-- Tombol Back -->
  <a class="back-button" href="utama.html">
    <svg class="back-icon" viewBox="0 0 24 24">
      <path d="M19 12H5M12 19l-7-7 7-7" />
    </svg>
    <span>Back</span>
  </a>

  <header>
    <h1>Sintia's Game Room</h1>
    <p>Mainkan mini game ulang tahun yang asyik di bawah ini!</p>
  </header>

  <main class="game-container">
    
    <!-- Game Card 1: Cake Catcher -->
    <div class="game-card">
      <div class="game-art-placeholder">🍰</div>
      <div class="game-info">
        <h2>Cake Catcher</h2>
        <p>Tangkap sebanyak mungkin irisan kue yang jatuh!</p>
        <a class="play-btn" href="game.html">Main Sekarang</a>
      </div>
    </div>

    <!-- Game Card 2: Balloon Pop -->
    <div class="game-card">
      <div class="game-art-placeholder">🎈</div>
      <div class="game-info">
        <h2>Balloon Pop</h2>
        <p>Pecahkan balon ulang tahun sebelum waktu habis!</p>
        <a class="play-btn" href="game.html?mode=balloon">Main Sekarang</a>
      </div>
    </div>

  </main>

  <footer>
    Made for Sintia's 20th Birthday
  </footer>

</body>
</html>
